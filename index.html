<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dental benefit summary extractor</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0 auto;
      max-width: 52rem;
      padding: 1.5rem 1.25rem 3rem;
      font: 16px/1.45 system-ui, sans-serif;
    }
    h1 { font-size: 1.45rem; line-height: 1.25; margin-bottom: 0.25rem; }
    p { max-width: 48rem; }
    .note {
      background: Canvas;
      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
      border-radius: 6px;
      padding: 0.75rem 0.9rem;
    }
    label { display: block; font-weight: 600; margin-top: 1rem; }
    input[type="file"] { width: 100%; box-sizing: border-box; margin-top: 0.35rem; }
    button {
      margin-top: 0.9rem;
      font: inherit;
      padding: 0.4rem 0.9rem;
    }
    .status { min-height: 1.4em; margin-top: 0.75rem; }
    .error { color: #9b1c1c; }
    h2 { font-size: 1.05rem; margin-top: 1.4rem; }
    .pages figure { margin: 0.75rem 0; }
    .pages canvas {
      display: block;
      max-width: 100%;
      height: auto;
      border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
      background: #fff;
    }
  </style>
</head>
<body>
  <h1>Dental benefit summary extractor</h1>
  <p>Unofficial. Results are CLI only. Nothing is extracted in the browser.</p>
  <p class="note">Nothing is extracted in the browser. This page only renders PDF page images. It does not read benefits and it does not send the file anywhere.</p>

  <label for="file">PDF file</label>
  <input id="file" type="file" accept=".pdf,application/pdf">
  <button id="render" type="button">Render pages</button>
  <button id="clear-file" type="button">Clear file</button>
  <p id="status" class="status" role="status">Nothing is extracted in the browser.</p>

  <h2>Page images</h2>
  <div id="pages" class="pages"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.min.mjs" type="module"></script>
  <script src="page.js" type="module"></script>
</body>
</html>
